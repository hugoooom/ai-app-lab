<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ask your PDF.</title>
<style>
  :root {
    --canvas: #ffffff;
    --canvas-alt: #f5f5f7;
    --ink: #1d1d1f;
    --ink-muted: #6e6e73;
    --ink-subtle: #86868b;
    --hairline: #d2d2d7;
    --accent: #0066cc;
    --card-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--canvas);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter",
      "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .nav {
    height: 52px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 40px;
    font-size: 13px;
    color: var(--ink-muted);
    border-bottom: 1px solid var(--hairline);
  }
  .nav a { color: var(--accent); text-decoration: none; }
  main { max-width: 900px; margin: 0 auto; padding: 0 32px 120px; }
  .hero { padding: 120px 0 96px; text-align: center; }
  h1 {
    font-size: 88px;
    font-weight: 500;
    letter-spacing: -0.03em;
    line-height: 1.05;
    margin: 0 0 24px;
  }
  .sub {
    font-size: 21px;
    line-height: 1.5;
    color: var(--ink-muted);
    max-width: 560px;
    margin: 0 auto;
  }
  section { padding: 96px 0; border-top: 1px solid var(--hairline); }
  .label {
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-subtle);
    margin-bottom: 24px;
  }
  .panel {
    background: var(--canvas-alt);
    border-radius: var(--radius);
    padding: 32px;
  }
  .row { display: flex; gap: 12px; align-items: center; }
  input[type="file"] { font-size: 15px; color: var(--ink-muted); }
  input[type="text"] {
    flex: 1;
    font: inherit;
    font-size: 17px;
    color: var(--ink);
    background: var(--canvas);
    border: 1px solid var(--hairline);
    border-radius: 980px;
    padding: 14px 20px;
    outline: none;
  }
  input[type="text"]:focus { border-color: var(--ink-subtle); }
  button {
    font: inherit;
    font-size: 15px;
    font-weight: 500;
    color: #fff;
    background: var(--ink);
    border: 0;
    border-radius: 980px;
    padding: 14px 26px;
    cursor: pointer;
    transition: opacity 0.2s;
    white-space: nowrap;
  }
  button:hover { opacity: 0.85; }
  button:disabled { opacity: 0.25; cursor: not-allowed; }
  .status { margin-top: 16px; font-size: 14px; color: var(--ink-subtle); min-height: 20px; }
  .answer {
    background: var(--canvas);
    border-radius: var(--radius);
    box-shadow: var(--card-shadow);
    padding: 32px;
    font-size: 19px;
    line-height: 1.6;
    white-space: pre-wrap;
  }
  .sources { margin-top: 32px; }
  .source {
    border-top: 1px solid var(--hairline);
    padding: 16px 0;
    font-size: 14px;
    color: var(--ink-muted);
    line-height: 1.6;
  }
  .score {
    display: inline-block;
    font-size: 11px;
    letter-spacing: 0.04em;
    color: var(--accent);
    margin-bottom: 6px;
  }
  .empty { color: var(--ink-subtle); font-size: 17px; }
</style>
</head>
<body>
  <nav class="nav">
    <span>AI App Lab</span>
    <a href="/docs">API Docs</a>
  </nav>

  <main>
    <div class="hero">
      <h1>Ask your PDF.</h1>
      <p class="sub">上传一份文档，直接提问。答案来自文档本身，不是模型的记忆。</p>
    </div>

    <section>
      <p class="label">01 — 上传文档</p>
      <div class="panel">
        <div class="row">
          <input id="file" type="file" accept=".pdf" />
          <button id="uploadBtn">上传并索引</button>
        </div>
        <p class="status" id="uploadStatus">支持 PDF，索引完成后才能提问。</p>
      </div>
    </section>

    <section>
      <p class="label">02 — 提问</p>
      <div class="row">
        <input id="question" type="text" placeholder="文档里说了什么？" disabled />
        <button id="askBtn" disabled>提问</button>
      </div>
      <p class="status" id="askStatus"></p>

      <div id="result" style="margin-top: 40px">
        <p class="empty">答案会显示在这里。</p>
      </div>
    </section>
  </main>

<script>
  const fileInput = document.getElementById("file");
  const uploadBtn = document.getElementById("uploadBtn");
  const uploadStatus = document.getElementById("uploadStatus");
  const questionInput = document.getElementById("question");
  const askBtn = document.getElementById("askBtn");
  const askStatus = document.getElementById("askStatus");
  const result = document.getElementById("result");

  let docId = null;

  uploadBtn.addEventListener("click", async () => {
    const file = fileInput.files[0];
    if (!file) {
      uploadStatus.textContent = "先选一个 PDF。";
      return;
    }
    uploadBtn.disabled = true;
    uploadStatus.textContent = "正在解析、切分、向量化…";
    try {
      const body = new FormData();
      body.append("file", file);
      const res = await fetch("/upload", { method: "POST", body });
      if (!res.ok) throw new Error("上传失败：" + res.status);
      const data = await res.json();
      docId = data.doc_id;
      uploadStatus.textContent = `已索引 ${data.chunks} 段，共 ${data.chars} 字。`;
      questionInput.disabled = false;
      askBtn.disabled = false;
      questionInput.focus();
    } catch (err) {
      uploadStatus.textContent = err.message;
    } finally {
      uploadBtn.disabled = false;
    }
  });

  askBtn.addEventListener("click", ask);
  questionInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") ask();
  });

  async function ask() {
    const q = questionInput.value.trim();
    if (!q || !docId) return;
    askBtn.disabled = true;
    askStatus.textContent = "检索中…";
    try {
      const url = `/doc/ask?q=${encodeURIComponent(q)}&doc_id=${encodeURIComponent(docId)}&k=3`;
      const res = await fetch(url);
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      render(data);
      askStatus.textContent = "";
    } catch (err) {
      askStatus.textContent = err.message;
    } finally {
      askBtn.disabled = false;
    }
  }

  function render(data) {
    result.innerHTML = "";
    const answer = document.createElement("div");
    answer.className = "answer";
    answer.textContent = data.answer;
    result.appendChild(answer);

    const list = document.createElement("div");
    list.className = "sources";
    data.sources.forEach((s, i) => {
      const item = document.createElement("div");
      item.className = "source";
      const score = document.createElement("span");
      score.className = "score";
      score.textContent = `片段 ${i + 1} · 相似度 ${s.score}`;
      const text = document.createElement("div");
      text.textContent = s.text;
      item.appendChild(score);
      item.appendChild(text);
      list.appendChild(item);
    });
    result.appendChild(list);
  }
</script>
</body>
</html>
